[workspace]
default-members = [
  "rats-cert",
  "c-api",
]
exclude = [
  "rats-transport",
]
members = [
  "rats-cert",
  "c-api",
  "intel-dcap",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.95"
once_cell = "1.21.3"
ring = "0.17.8"
spin = "0.9.8"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
zeroize = "1.8.1"
